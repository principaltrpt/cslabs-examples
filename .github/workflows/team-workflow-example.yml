name: Synthetic scheduled review

on:
  push:
  pull_request:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test team-workflows/scheduled-review/review.test.mjs
      - run: node team-workflows/scheduled-review/cli.mjs team-workflows/scheduled-review/data/fresh.json
